services:
  mysql:
    image: mysql:8.0
    container_name: udayana-mysql
    restart: always
    command:
      - --performance_schema=OFF
      - --innodb_buffer_pool_size=64M
      - --innodb_log_buffer_size=8M
      - --max_connections=50
      - --innodb_redo_log_capacity=16M
      - --table_open_cache=200
      - --table_definition_cache=400
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 350M
        reservations:
          cpus: '0.10'
          memory: 128M
    mem_limit: 350m
    cpus: 0.60
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admindb@2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-udayana}
      MYSQL_USER: ${MYSQL_USER:-udayana_root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admindb@2025}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-admindb@2025}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - udayana-network

  redis:
    image: redis:7-alpine
    container_name: udayana-redis
    restart: always
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 100M
        reservations:
          cpus: '0.05'
          memory: 32M
    mem_limit: 100m
    cpus: 0.25
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - udayana-network

  api:
    image: ghcr.io/wildan190/udayana-backend:latest
    container_name: udayana-api
    restart: always
    command: ["/app/udayana-api"]
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 250M
        reservations:
          cpus: '0.10'
          memory: 64M
    mem_limit: 250m
    cpus: 0.75
    environment:
      API_ADDR: :8080
      GOMEMLIMIT: 180MiB
      GOGC: 80
      MYSQL_ADDR: mysql:3306
      MYSQL_USER: ${MYSQL_USER:-udayana_root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admindb@2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-udayana}
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-production-jwt-secret-udayana-market-2026}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-production}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-Mid-server-4MjfNoKyHg2hSZpfcHTq4KuW}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-Mid-client-v5rqlvwW-Gd8S6C_}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-support@huntr.id}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-dttskgcccpyzxizv}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-support@huntr.id}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Huntr API}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - udayana-network

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  udayana-network:
    driver: bridge
